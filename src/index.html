<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
    />
    <meta
      http-equiv="X-UA-Compatible"
      content="ie=edge"
    />
    <title>Moyo header</title>
    <link
      rel="stylesheet"
      href="./style.css"
    />
  </head>
  <body>
    <header class="header">
      <a
        class="header__logo"
        href="#home"
      >
        <img
          class="header__logo-img"
          src="./images/logo.png"
          alt="logo"
        />
      </a>

      <nav class="header__nav">
        <ul class="header__nav-list">
          <li class="header__nav-item">
            <a
              class="header__nav-link is-active"
              href="#Apple"
            >
              Apple
            </a>
          </li>
          <li class="header__nav-item">
            <a
              class="header__nav-link"
              href="#Samsung"
            >
              Samsung
            </a>
          </li>
          <li class="header__nav-item">
            <a
              class="header__nav-link"
              href="#Smartphones"
            >
              Smartphones
            </a>
          </li>
          <li class="header__nav-item">
            <a
              class="header__nav-link"
              data-qa="hover"
              href="#Laptops & Computers"
            >
              Laptops & Computers
            </a>
          </li>
          <li class="header__nav-item">
            <a
              class="header__nav-link"
              href="#Gadgets"
            >
              Gadgets
            </a>
          </li>
          <li class="header__nav-item">
            <a
              class="header__nav-link"
              href="#Tablets"
            >
              Tablets
            </a>
          </li>
          <li class="header__nav-item">
            <a
              class="header__nav-link"
              href="#Photo"
            >
              Photo
            </a>
          </li>
          <li class="header__nav-item">
            <a
              class="header__nav-link"
              href="#Video"
            >
              Video
            </a>
          </li>
        </ul>
      </nav>
    </header>
  </body>
</html>
